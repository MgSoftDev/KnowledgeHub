<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380">
<rect width="1000" height="380" fill="#FFFFFF"/>
<text x="20" y="30" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F4E79">Almacen — Productos, categorías y movimientos</text>
<text x="20" y="48" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#767676">La existencia de un producto es la suma de sus movimientos: no hay columna de existencia</text>

